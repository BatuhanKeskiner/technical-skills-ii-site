<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 740" width="980" height="740"
     role="img" aria-label="A developing tray seen from above, with developer in it">
  <!-- A DEVELOPING TRAY, STRAIGHT DOWN, LANDSCAPE.
       Landscape because a sheet goes in flat and the long edge runs across the
       bench; a portrait tray would have the student turning their head to read
       a print that is the right way up in the real world.

       The developer is almost clear. It was drawn as a warm bath first and that
       was wrong: the print is judged THROUGH this liquid, and a bath strong
       enough to look convincing warms every tone in the tray, so the student
       reads the chemistry instead of their own exposure. What actually tells
       you there is liquid in a tray is not its colour - it is the meniscus at
       the wall and the one reflection running across the surface.

       Layer order matters and is the whole reason this is drawn rather than
       photographed:  floor + ribs -> bath -> THE SHEET -> surface.
       The paper goes UNDER the reflection, so it lies in the tray instead of
       sitting on a picture of one. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#A9A9A5"/>
      <stop offset="0.5" stop-color="#9C9C98"/>
      <stop offset="1"   stop-color="#8C8C87"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#83837E"/>
      <stop offset="1"   stop-color="#94948F"/>
    </linearGradient>
    <linearGradient id="floor" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#93938E"/>
      <stop offset="0.55" stop-color="#8B8B86"/>
      <stop offset="1"    stop-color="#82827D"/>
    </linearGradient>
    <!-- barely there: enough to warm the grey, not enough to warm a print -->
    <linearGradient id="dev" x1="0.1" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#C6BA9E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#B3A78C" stop-opacity="0.22"/>
    </linearGradient>
    <!-- the reflection: one band across the surface, off the near-left source -->
    <linearGradient id="sheen" x1="0.05" y1="0" x2="0.75" y2="0.9">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.22" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Split out of tray.svg so a real strip can be drawn BETWEEN the two:
       the tray and its developer go down first, the sheet goes in, and the
       surface reflection goes over the top of it. A sheet painted on top of
       the sheen is a sheet lying on the water. -->


  <!-- the body, with the spout cut into its own outline -->
  <path d="M44 28 h848 a24 24 0 0 1 24 24 v576
           l-58 60 a24 24 0 0 1 -17 7 H44
           a24 24 0 0 1 -24 -24 V52 a24 24 0 0 1 24 -24 z"
        fill="url(#rim)" stroke="#6E6E69" stroke-width="2"/>

  <!-- the sloped wall: a lip, not a frame -->
  <path d="M64 56 h808 a12 12 0 0 1 12 12 v552
           l-44 46 a12 12 0 0 1 -9 4 H64
           a12 12 0 0 1 -12 -12 V68 a12 12 0 0 1 12 -12 z"
        fill="url(#wall)" stroke="#767670" stroke-width="1.5"/>

  <!-- the floor -->
  <path d="M82 74 h772 a10 10 0 0 1 10 10 v528
           l-36 38 a10 10 0 0 1 -8 4 H82
           a10 10 0 0 1 -10 -10 V84 a10 10 0 0 1 10 -10 z"
        fill="url(#floor)" stroke="#7B7B75" stroke-width="1.5"/>

  <!-- THE RIBS, from the photograph of a real tray Batu sent.

       They are not broad ridges and they are not five hair lines either. On
       the tray in front of him they are FOUR thin raised beads across the
       floor, and what is wide is the CHANNEL between them - which is the part
       that holds the developer, and the part he was calling the groove. So:
       four beads, evenly spaced, each read as a highlight with its own shadow
       under it, and five wide channels of bare floor between and around them.

       Wrong twice on the way here. First they were nine wide in a hundred and
       too faint to see, which he called thin; then they were made thirty-two
       and forty-six wide, which he called too many - because widening a rib
       narrows the channel, and it was the channel he wanted. -->
  <g stroke-linecap="round">
    <g fill="none" stroke="#C6C6C1" stroke-width="11" opacity="0.9">
      <path d="M110 188 H842"/><path d="M110 302 H842"/>
      <path d="M110 416 H840"/><path d="M110 530 H834"/>
    </g>
    <g fill="none" stroke="#5A5A55" stroke-width="5" opacity="0.5">
      <path d="M110 196 H842"/><path d="M110 310 H842"/>
      <path d="M110 424 H840"/><path d="M110 538 H834"/>
    </g>
  </g>

  <!-- THE DEVELOPER — the tint, almost nothing -->
  <path id="bath"
        d="M78 70 h780 a10 10 0 0 1 10 10 v536
           l-38 40 a10 10 0 0 1 -8 4 H78
           a10 10 0 0 1 -10 -10 V80 a10 10 0 0 1 10 -10 z"
        fill="url(#dev)"/>

  <!-- where it climbs the wall: this line does most of the work -->
  <path d="M78 70 h780 a10 10 0 0 1 10 10 v536
           l-38 40 a10 10 0 0 1 -8 4 H78
           a10 10 0 0 1 -10 -10 V80 a10 10 0 0 1 10 -10 z"
        fill="none" stroke="#E4DCC8" stroke-width="3.5" opacity="0.8"/>

  
</svg>
